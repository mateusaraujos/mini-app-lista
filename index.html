<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sets the theme color for mobile browsers and PWA status bars -->
    <meta name="theme-color" content="#f8f9fa" id="theme-color-meta" />

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Basic SEO metadata -->
    <meta
      name="description"
      content="Crie uma lista de tarefas simples e rápida."
    />
    <meta name="keywords" content="lista, tarefas, criar, simples, rápido" />
    <meta name="author" content="Mateus Araújo Silva" />

    <title>Crie uma Lista</title>

    <!-- Google Material Icons (used in buttons) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Main CSS stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <main>
        <h1><span>Crie uma</span> <span>Lista</span></h1>

        <form id="title-form">
          <!-- List title input -->
          <input
            type="text"
            aria-label="Nome da lista"
            id="title"
            placeholder="Digite o nome da lista"
            title="Dê um nome para a sua lista."
            autocomplete="off"
            maxlength="30"
            autofocus
          />

          <!-- Submit button -->
          <button type="submit" title="Cria lista" aria-label="Criar lista">
            <span class="material-symbols-outlined" aria-hidden="true">
              add_task
            </span>
            <span>Criar</span>
          </button>
        </form>
      </main>
    </div>

    <!-- Main JavaScript logic for title validation and navigation -->
    <script src="script.js" type="module"></script>
  </body>
</html>
